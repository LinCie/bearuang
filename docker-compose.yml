services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-7aab038b0d79c0040ddfe6b607cbf2b6}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a119259d4a6f1aa3c9f4f61658114894}
      POSTGRES_DB: ${POSTGRES_DB:-bearuang}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bearuang-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-0b36760a936962694339b00777de7b0b}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-8889ba14228a9f94345c8f542e39b3fb}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    entrypoint: >
      sh -c "
        mkdir -p /data/bearuang &&
        minio server /data --console-address ':9001' &
        sleep 5 &&
        mc alias set local http://localhost:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc anonymous set download local/bearuang &&
        mc anonymous set upload local/bearuang &&
        mc anonymous set put local/bearuang &&
        echo '[
          {
            \"AllowedOrigins\": [\"*\"],
            \"AllowedMethods\": [\"GET\", \"PUT\", \"POST\", \"DELETE\", \"HEAD\"],
            \"AllowedHeaders\": [\"*\"],
            \"MaxAgeSeconds\": 3600
          }
        ]' > /tmp/cors.json &&
        mc admin bucket cors set local/bearuang /tmp/cors.json || true &&
        wait
      "
    restart: unless-stopped

volumes:
  bearuang-data:
  minio-data:
